<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klickräknare</title>
<meta name="description" content="En minimal klickräknare — bevisar att publish-prototype-flödet fungerar end-to-end.">
<meta name="experiment:tags" content="exempel, demo">
<style>
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; gap: 1rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #14151a; color: #f0f0f0;
  }
  button {
    font-size: 1.1rem; padding: 0.75rem 1.5rem; border-radius: 10px; border: 1px solid #2a2b31;
    background: #1c1d23; color: #f0f0f0; cursor: pointer;
  }
  button:hover { border-color: #9a9a9a; }
  #count { font-size: 3rem; font-weight: 700; }
  a { color: #9a9a9a; font-size: 0.9rem; }
</style>
</head>
<body>
  <div id="count">0</div>
  <button id="btn">Klicka mig</button>
  <p><a href="../../index.html">← Tillbaka till alla experiment</a></p>
  <script>
    let n = 0;
    const countEl = document.getElementById("count");
    document.getElementById("btn").addEventListener("click", () => {
      n += 1;
      countEl.textContent = n;
    });
  </script>
</body>
</html>
